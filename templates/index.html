<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単語 Tango</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    #header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.2rem;
      color: #555;
      letter-spacing: 0.1em;
    }

    #settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: #aaa;
      padding: 2px 6px;
      border-radius: 6px;
    }
    #settings-btn:hover { background: #eee; color: #555; }

    #book-switch {
      display: flex;
      gap: 4px;
      background: #eee;
      border-radius: 20px;
      padding: 3px;
      margin-bottom: 16px;
    }

    .book-btn {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.8rem;
      color: #999;
      padding: 6px 16px;
      border-radius: 16px;
    }

    .book-btn.active {
      background: #fff;
      color: #222;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    #exit-mode-btn {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      color: #aaa;
      padding: 6px 10px;
      border-radius: 6px;
    }
    #exit-mode-btn:hover { background: #eee; color: #555; }

    #stats {
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 24px;
    }

    #card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
      padding: 40px 32px;
      text-align: center;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #section-tag {
      font-size: 0.75rem;
      background: #eee;
      color: #777;
      padding: 2px 10px;
      border-radius: 20px;
    }

    #jp {
      font-size: 2.8rem;
      font-weight: bold;
      color: #222;
    }

    #kana {
      font-size: 1rem;
      color: #aaa;
      min-height: 1.4em;
    }

    #answer {
      font-size: 1.4rem;
      color: #e05a2b;
      font-weight: 500;
      margin-top: 8px;
      display: none;
    }

    body.book-en #jp {
      font-size: 1.4rem;
      line-height: 1.5;
    }

    body.book-en #kana {
      font-size: 1.15rem;
      color: #222;
      font-weight: 600;
      line-height: 1.5;
      text-align: left;
    }

    body.book-en #answer {
      font-size: 1.05rem;
      line-height: 1.5;
      text-align: left;
    }

    #done-msg {
      display: none;
      text-align: center;
      color: #555;
      font-size: 1.1rem;
      line-height: 2;
    }

    #done-msg .sub {
      font-size: 0.85rem;
      color: #aaa;
    }

    #level-bar {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ddd;
    }
    .dot.filled { background: #e05a2b; }

    #flip-btn {
      margin-top: 24px;
      padding: 12px 36px;
      font-size: 1rem;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      max-width: 400px;
    }

    #score-btns {
      display: none;
      gap: 12px;
      width: 100%;
      max-width: 400px;
      margin-top: 12px;
    }

    #done-actions {
      display: none;
      gap: 12px;
      width: 100%;
      max-width: 400px;
      margin-top: 12px;
    }

    .done-action-btn {
      flex: 1;
      padding: 14px 0;
      font-size: 0.95rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      background: #eee;
      color: #555;
    }

    .score-btn {
      flex: 1;
      padding: 14px 0;
      font-size: 0.95rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .s1 { background: #fde8e0; color: #c0392b; }
    .s2 { background: #fef9e0; color: #b7950b; }
    .s3 { background: #e0f5e9; color: #1e8449; }

    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #modal-overlay.open { display: flex; }

    #modal {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #modal h2 { font-size: 1rem; color: #333; }
    #modal label { font-size: 0.85rem; color: #666; }

    #limit-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 4px;
    }

    #modal-save {
      padding: 12px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #modal-cancel {
      padding: 10px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.85rem;
      cursor: pointer;
    }
    /* 问题与答案里的字面量 \n 渲染为真实换行，供 KaTeX 跨行识别公式 */
    #jp, #kana, #answer { white-space: pre-wrap; }

    /* 行间公式的上下留白由原文的空行提供，这里去掉 KaTeX 自带的 margin */
    .katex-display { margin: 0; }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='katex/katex.min.css') }}">
  <script src="{{ url_for('static', filename='katex/katex.min.js') }}"></script>
  <script src="{{ url_for('static', filename='katex/auto-render.min.js') }}"></script>
  <script src="{{ url_for('static', filename='drill.js') }}"></script>
</head>
<body>
  <button id="exit-mode-btn" onclick="exitCurrentMode()"></button>
  <div id="header">
    <h1>単語 Tango</h1>
    <button id="settings-btn" onclick="openSettings()" title="设置">⚙</button>
  </div>
  <div id="book-switch">
    <button class="book-btn" data-book="jp" onclick="switchBook('jp')">日语</button>
    <button class="book-btn" data-book="en" onclick="switchBook('en')">English</button>
  </div>
  <div id="stats"></div>

  <div id="card">
    <div id="section-tag"></div>
    <div id="jp">…</div>
    <div id="kana"></div>
    <div id="level-bar"></div>
    <div id="answer"></div>
    <div id="done-msg"></div>
  </div>

  <button id="flip-btn" onclick="flip()">翻牌</button>
  <div id="score-btns">
    <button class="score-btn s1" onclick="score(1)">不会</button>
    <button class="score-btn s2" onclick="score(2)">模糊</button>
    <button class="score-btn s3" onclick="score(3)">记住了</button>
  </div>
  <div id="done-actions">
    <button class="done-action-btn" onclick="continueLearning()">继续学习</button>
    <button class="done-action-btn" onclick="startFreeReview()">复习</button>
  </div>

  <div id="modal-overlay">
    <div id="modal">
      <h2>每日设置</h2>
      <label>
        每天学习新词数量
        <input id="new-limit-input" type="number" min="0" max="200" value="10">
      </label>
      <label>
        每天复习旧词数量
        <input id="review-limit-input" type="number" min="0" max="200" value="20">
      </label>
      <button id="modal-save" onclick="saveSettings()">保存</button>
      <button id="modal-cancel" onclick="closeSettings()">取消</button>
    </div>
  </div>

  <script>
    let current = null;
    let isFreeReview = false;
    let freeReviewList = [];
    let freeReviewIndex = 0;
    let currentBook = localStorage.getItem("tango_book") || "jp";

    // 本轮练习队列：当天点了「模糊」/「不认识」的词随机重现，答对才放走。
    // 纯逻辑在 static/drill.js，这里只管状态和渲染。
    let drill = {};
    let isDrillCard = false;

    function reloadDrill() {
      drill = Drill.loadDrill(currentBook, todayStr(), localStorage);
    }

    function persistDrill() {
      Drill.saveDrill(currentBook, todayStr(), drill, localStorage);
    }

    function updateBookSwitch() {
      document.querySelectorAll(".book-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.book === currentBook);
      });
      document.body.classList.toggle("book-en", currentBook === "en");
    }

    function switchBook(book) {
      if (book === currentBook) return;
      currentBook = book;
      localStorage.setItem("tango_book", book);
      isFreeReview = false;
      freeReviewList = [];
      freeReviewIndex = 0;
      reloadDrill();
      updateBookSwitch();
      loadNext();
    }

    // 卡片正面的几个元素，和"已完成"提示互相切换显示。
    //
    // 这里以前是直接 `card.innerHTML = ...` 覆盖整张卡片，等于把 #jp / #answer
    // 这些元素从 DOM 里删掉。之后任何一次 loadNext() 走到
    // `document.getElementById("answer").style.display` 都会对 null 取属性而抛异常，
    // 函数当场中断 —— 表现就是一本额度用完后，切到另一本、点「继续学习」、点「复习」
    // 全都没反应，页面卡在"额度已用完"那张卡片上，看起来像另一本也被限制了。
    const WORD_FACE_IDS = ["section-tag", "jp", "kana", "level-bar", "answer"];

    function showDoneMessage(html) {
      WORD_FACE_IDS.forEach((id) => {
        document.getElementById(id).style.display = "none";
      });
      const el = document.getElementById("done-msg");
      el.innerHTML = html;
      el.style.display = "block";
    }

    function showWordFace() {
      document.getElementById("done-msg").style.display = "none";
      WORD_FACE_IDS.forEach((id) => {
        document.getElementById(id).style.display = "";
      });
    }

    function renderText(el, text) {
      // 字面量 \n 转成真实换行（靠 CSS white-space: pre-wrap 显示），
      // 不再用 <br>，否则 <br> 会把公式切成多个文本节点，KaTeX 认不出来
      el.textContent = (text || "").replace(/\\n/g, "\n");
      if (window.renderMathInElement) {
        renderMathInElement(el, {
          delimiters: [
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
          ],
          throwOnError: false,
        });
      }
    }

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    // 「继续学习」的展开状态按本存。之前是一个全局 key，
    // 在一本里点了展开，切到另一本会把它带过去 / 切回来又丢掉。
    function extendedKey() {
      return "tango_extended_" + currentBook;
    }

    function isExtendedToday() {
      return localStorage.getItem(extendedKey()) === todayStr();
    }

    function updateExitButton() {
      const btn = document.getElementById("exit-mode-btn");
      if (isFreeReview) {
        btn.textContent = "← 退出复习";
        btn.style.display = "block";
      } else if (isExtendedToday()) {
        btn.textContent = "← 返回";
        btn.style.display = "block";
      } else {
        btn.style.display = "none";
      }
    }

    function exitCurrentMode() {
      if (isFreeReview) {
        isFreeReview = false;
        freeReviewList = [];
        freeReviewIndex = 0;
      } else {
        localStorage.removeItem(extendedKey());
      }
      loadNext();
    }

    async function loadNext() {
      updateExitButton();
      const extended = isExtendedToday();
      const params = new URLSearchParams({ book: currentBook });
      if (extended) params.set("extended", "1");
      const res = await fetch("/api/next?" + params.toString());
      const data = await res.json();

      document.getElementById("score-btns").style.display = "none";
      document.getElementById("answer").style.display = "none";
      document.getElementById("flip-btn").style.display = "block";
      document.getElementById("done-actions").style.display = "none";

      if (data.done) {
        const progressLine = `新词 ${data.today_new_count}/${data.new_words_limit} · 复习 ${data.today_review_count}/${data.review_words_limit}`;
        const head = data.reason === "daily_limit"
          ? "今天的额度已用完！"
          : "所有到期单词复习完了！";

        showDoneMessage(`${head}<br><span class="sub">${progressLine}</span>`);
        document.getElementById("flip-btn").style.display = "none";
        document.getElementById("stats").textContent = "";
        document.getElementById("done-actions").style.display = "flex";
        return;
      }

      showWordFace();
      current = data;
      renderText(document.getElementById("jp"), data.jp);
      renderText(document.getElementById("kana"), data.kana || "");
      document.getElementById("kana").style.display = currentBook === "en" ? "none" : "block";
      renderText(document.getElementById("answer"), data.zh);
      document.getElementById("section-tag").textContent = data.section;

      renderLevelBar(data.level);

      document.getElementById("stats").textContent =
        `新词 ${data.today_new_count}/${data.new_words_limit} · 复习 ${data.today_review_count}/${data.review_words_limit}`;
    }

    function renderLevelBar(level) {
      const bar = document.getElementById("level-bar");
      bar.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        const d = document.createElement("div");
        d.className = "dot" + (i < level ? " filled" : "");
        bar.appendChild(d);
      }
    }

    function flip() {
      document.getElementById("answer").style.display = "block";
      document.getElementById("kana").style.display = "block";
      document.getElementById("flip-btn").style.display = "none";
      document.getElementById("score-btns").style.display = "flex";
    }

    async function score(s) {
      if (isFreeReview) {
        freeReviewIndex++;
        showFreeReviewCard();
        return;
      }

      const res = await fetch("/api/review", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jp: current.jp, score: s, book: currentBook }),
      });
      const data = await res.json();

      if (data.reached_max_level) {
        const wantsMastery = confirm(`「${current.jp}」已经记得很牢固了，要斩掉吗？`);
        if (wantsMastery) {
          await fetch("/api/mastery", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ jp: current.jp, book: currentBook }),
          });
        }
      }

      loadNext();
    }

    async function openSettings() {
      document.querySelector("#modal h2").textContent =
        currentBook === "en" ? "每日设置 · English" : "每日设置 · 日语";
      const res = await fetch("/api/settings?book=" + currentBook);
      const data = await res.json();
      document.getElementById("new-limit-input").value = data.new_words_limit;
      document.getElementById("review-limit-input").value = data.review_words_limit;
      document.getElementById("modal-overlay").classList.add("open");
    }

    function closeSettings() {
      document.getElementById("modal-overlay").classList.remove("open");
    }

    async function saveSettings() {
      const newWordsLimit = parseInt(document.getElementById("new-limit-input").value);
      const reviewWordsLimit = parseInt(document.getElementById("review-limit-input").value);
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          book: currentBook,
          new_words_limit: newWordsLimit,
          review_words_limit: reviewWordsLimit,
        }),
      });
      closeSettings();
      loadNext();
    }

    async function startFreeReview() {
      const res = await fetch("/api/review_today?book=" + currentBook);
      freeReviewList = await res.json();
      freeReviewIndex = 0;
      isFreeReview = true;
      updateExitButton();
      document.getElementById("done-actions").style.display = "none";
      showFreeReviewCard();
    }

    function showFreeReviewCard() {
      document.getElementById("score-btns").style.display = "none";
      document.getElementById("answer").style.display = "none";
      document.getElementById("flip-btn").style.display = "block";

      if (freeReviewIndex >= freeReviewList.length) {
        isFreeReview = false;
        updateExitButton();
        showDoneMessage("复习完了！");
        document.getElementById("flip-btn").style.display = "none";
        document.getElementById("done-actions").style.display = "flex";
        return;
      }

      showWordFace();
      const word = freeReviewList[freeReviewIndex];
      current = word;
      renderText(document.getElementById("jp"), word.jp);
      renderText(document.getElementById("kana"), word.kana || "");
      document.getElementById("kana").style.display = currentBook === "en" ? "none" : "block";
      renderText(document.getElementById("answer"), word.zh);
      document.getElementById("section-tag").textContent = word.section;
      document.getElementById("level-bar").innerHTML = "";
      document.getElementById("stats").textContent =
        `自由复习 ${freeReviewIndex + 1}/${freeReviewList.length}`;
    }

    function continueLearning() {
      localStorage.setItem(extendedKey(), todayStr());
      loadNext();
    }

    localStorage.removeItem("tango_extended_date");  // 清掉分本之前的旧 key
    updateBookSwitch();
    loadNext();
  </script>
</body>
</html>
